<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene</title>
<style>
  :root{
    --sky-top:#1c3f73;
    --sky-mid:#3f6ea3;
    --sky-low:#8fb0cf;
    --haze:#c9d6e0;
    --cloud-light:#f6e3cf;
    --cloud-warm:#e9b489;
    --cloud-shadow:#b7c4d6;
    --struct-hi:#f3efe9;
    --struct-mid:#d9d2c8;
    --struct-lo:#a9a396;
    --struct-shadow:#6f6c66;
    --city:#5b6a80;
    --city-dark:#3d4a60;
    --water:#7d93ad;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--sky-top);
    overflow:hidden;
    font-family:system-ui,sans-serif;
  }

  .scene{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- SKY ---------- */
  .sky{
    position:absolute;
    inset:0;
    background:
      radial-gradient(120% 90% at 50% 8%, var(--sky-top) 0%, var(--sky-mid) 42%, var(--sky-low) 74%, var(--haze) 100%);
  }
  .sky::after{
    /* subtle warm glow rising off the horizon */
    content:"";
    position:absolute;
    left:0;right:0;bottom:0;
    height:46%;
    background:linear-gradient(to top, rgba(233,180,137,.55), rgba(233,180,137,0) 70%);
    pointer-events:none;
  }

  /* ---------- CLOUDS ---------- */
  .clouds{position:absolute;inset:0}
  .clouds svg{position:absolute;width:100%;height:100%;left:0;top:0}

  .cloud{
    position:absolute;
    border-radius:50%;
    filter:blur(2px);
    will-change:transform;
  }
  .cl-drift{animation:drift 60s linear infinite}
  .cl-drift2{animation:drift 90s linear infinite}
  @keyframes drift{
    from{transform:translateX(0)}
    to{transform:translateX(40px)}
  }

  /* ---------- STRUCTURE ---------- */
  .structure{
    position:absolute;
    left:50%;top:47%;
    transform:translate(-50%,-50%);
    width:min(70vw,760px);
    height:auto;
    filter:drop-shadow(0 30px 50px rgba(30,45,70,.35));
  }

  /* ---------- SKYLINE ---------- */
  .skyline{
    position:absolute;
    left:0;right:0;bottom:0;
    height:34%;
    z-index:3;
  }
  .skyline svg{width:100%;height:100%;display:block}

  /* ---------- HEADER LOGO MARK (top-left, no text) ---------- */
  .brandmark{
    position:absolute;
    top:22px;left:24px;
    width:34px;height:34px;
    z-index:20;
    opacity:.9;
  }

  /* ---------- Sign-in affordance (icon only, no text) ---------- */
  .signin{
    position:absolute;
    top:20px;right:22px;
    z-index:20;
    width:74px;height:34px;
    border:1px solid rgba(255,255,255,.5);
    border-radius:8px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .25s ease, transform .25s ease;
  }
  .signin:hover{background:rgba(255,255,255,.24);transform:translateY(-1px)}
  .signin svg{width:16px;height:16px}

  @media (prefers-reduced-motion: reduce){
    .cl-drift,.cl-drift2{animation:none}
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="sky"></div>

    <!-- CLOUDS -->
    <div class="clouds">
      <svg viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="cloudL" cx="50%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#faeeda"/>
            <stop offset="55%" stop-color="#efc9a4"/>
            <stop offset="100%" stop-color="#c9cdd8" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="cloudR" cx="50%" cy="40%" r="70%">
            <stop offset="0%" stop-color="#f6e2c9"/>
            <stop offset="50%" stop-color="#e6b488"/>
            <stop offset="100%" stop-color="#b9c2d3" stop-opacity="0"/>
          </radialGradient>
          <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
        </defs>

        <!-- left cloud bank -->
        <g filter="url(#soft)" class="cl-drift">
          <ellipse cx="150" cy="240" rx="180" ry="70" fill="url(#cloudL)"/>
          <ellipse cx="90"  cy="210" rx="110" ry="55" fill="url(#cloudL)"/>
          <ellipse cx="240" cy="200" rx="120" ry="60" fill="url(#cloudL)"/>
          <ellipse cx="60"  cy="270" rx="90"  ry="45" fill="url(#cloudL)"/>
          <ellipse cx="300" cy="260" rx="100" ry="48" fill="url(#cloudL)"/>
        </g>

        <!-- right cloud bank -->
        <g filter="url(#soft)" class="cl-drift2">
          <ellipse cx="820" cy="250" rx="190" ry="72" fill="url(#cloudR)"/>
          <ellipse cx="900" cy="215" rx="120" ry="58" fill="url(#cloudR)"/>
          <ellipse cx="740" cy="215" rx="120" ry="58" fill="url(#cloudR)"/>
          <ellipse cx="950" cy="280" rx="95"  ry="46" fill="url(#cloudR)"/>
          <ellipse cx="700" cy="285" rx="100" ry="48" fill="url(#cloudR)"/>
        </g>

        <!-- low soft warm haze band -->
        <g filter="url(#soft)">
          <ellipse cx="500" cy="360" rx="520" ry="60" fill="url(#cloudR)" opacity=".5"/>
        </g>
      </svg>
    </div>

    <!-- STRUCTURE (interlocking tube monogram) -->
    <svg class="structure" viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#f5f1eb"/>
          <stop offset="45%" stop-color="#ddd6cc"/>
          <stop offset="80%" stop-color="#b3ada1"/>
          <stop offset="100%" stop-color="#8f8a7f"/>
        </linearGradient>
        <linearGradient id="tubeSide" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"  stop-color="#c7c0b5"/>
          <stop offset="50%" stop-color="#efeae2"/>
          <stop offset="100%" stop-color="#a49e92"/>
        </linearGradient>
        <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#efe9e0"/>
          <stop offset="100%" stop-color="#9c968a"/>
        </linearGradient>
      </defs>

      <!-- Outer hexagon frame (rounded) -->
      <path d="
        M300 30
        L520 160
        Q560 185 560 235
        L560 300
        Q560 350 520 375
        L300 500
        Q285 508 270 500
        L80 390
        Q40 365 40 315
        L40 210
        Q40 160 80 135
        L280 30
        Q290 25 300 30 Z"
        fill="none" stroke="url(#tube)" stroke-width="46" stroke-linejoin="round"/>
      <!-- inner highlight on hex -->
      <path d="
        M300 30
        L520 160
        Q560 185 560 235
        L560 300
        Q560 350 520 375
        L300 500
        Q285 508 270 500
        L80 390
        Q40 365 40 315
        L40 210
        Q40 160 80 135
        L280 30
        Q290 25 300 30 Z"
        fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="8" stroke-linejoin="round"/>

      <!-- Interior "C" arc (open on the right) -->
      <path d="
        M420 150
        Q300 120 240 210
        Q195 275 240 345
        Q300 430 420 400"
        fill="none" stroke="url(#tubeSide)" stroke-width="40" stroke-linecap="round"/>

      <!-- Vertical bar / tower of the monogram -->
      <rect x="278" y="150" width="46" height="250" rx="20" fill="url(#tube)"/>
      <rect x="286" y="150" width="10" height="250" rx="5" fill="#ffffff" opacity=".3"/>

      <!-- central tower detail -->
      <rect x="292" y="120" width="20" height="60" rx="8" fill="url(#core)"/>
      <circle cx="302" cy="118" r="10" fill="#e9e3d9"/>

      <!-- small window rows (grey ticks) -->
      <g fill="#5f5b53" opacity=".55">
        <rect x="150" y="330" width="8" height="6" rx="1"/>
        <rect x="165" y="330" width="8" height="6" rx="1"/>
        <rect x="180" y="330" width="8" height="6" rx="1"/>
        <rect x="150" y="342" width="8" height="6" rx="1"/>
        <rect x="165" y="342" width="8" height="6" rx="1"/>
        <rect x="415" y="300" width="8" height="6" rx="1"/>
        <rect x="430" y="300" width="8" height="6" rx="1"/>
        <rect x="415" y="312" width="8" height="6" rx="1"/>
      </g>
    </svg>

    <!-- SKYLINE + WATER -->
    <div class="skyline">
      <svg viewBox="0 0 1000 200" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#9fb1c6"/>
            <stop offset="100%" stop-color="#5f7188"/>
          </linearGradient>
          <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6b7a90"/>
            <stop offset="100%" stop-color="#41506a"/>
          </linearGradient>
        </defs>

        <!-- water -->
        <rect x="0" y="120" width="1000" height="80" fill="url(#water)"/>
        <!-- shoreline haze -->
        <rect x="0" y="112" width="1000" height="16" fill="#c7d2de" opacity=".5"/>

        <!-- distant skyline silhouette -->
        <g fill="url(#bld)">
          <rect x="60"  y="86"  width="16" height="34"/>
          <rect x="80"  y="70"  width="10" height="50"/>
          <rect x="96"  y="92"  width="20" height="28"/>
          <rect x="180" y="80"  width="12" height="40"/>
          <rect x="196" y="60"  width="14" height="60"/>
          <rect x="214" y="88"  width="18" height="32"/>
          <rect x="250" y="96"  width="26" height="24"/>

          <rect x="600" y="90"  width="22" height="30"/>
          <rect x="626" y="72"  width="12" height="48"/>
          <rect x="700" y="84"  width="14" height="36"/>
          <rect x="718" y="66"  width="10" height="54"/>
          <rect x="732" y="90"  width="20" height="30"/>
          <rect x="820" y="58"  width="12" height="62"/>
          <rect x="836" y="80"  width="16" height="40"/>
          <rect x="900" y="92"  width="24" height="28"/>
          <rect x="928" y="74"  width="10" height="46"/>
        </g>

        <!-- antenna masts (thin) -->
        <g stroke="#43516a" stroke-width="2">
          <line x1="880" y1="120" x2="880" y2="30"/>
          <line x1="850" y1="120" x2="850" y2="50"/>
          <line x1="820" y1="30" x2="880" y2="30" opacity=".6"/>
        </g>

        <!-- dark foreground land (bottom-right) -->
        <path d="M640 200 L640 150 Q760 130 900 150 L1000 168 L1000 200 Z" fill="#2f3a4c"/>
        <path d="M0 200 L0 176 Q120 168 260 178 L360 190 L360 200 Z" fill="#33404f" opacity=".8"/>

        <!-- faint reflections in water -->
        <g fill="#c7d2de" opacity=".18">
          <rect x="196" y="128" width="14" height="30"/>
          <rect x="718" y="128" width="10" height="26"/>
          <rect x="820" y="128" width="12" height="34"/>
        </g>
      </svg>
    </div>

    <!-- top-left brand mark (icon only, no text) -->
    <svg class="brandmark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 3 L34 11 L34 29 L20 37 L6 29 L6 11 Z"
            fill="none" stroke="#f2eee7" stroke-width="2" stroke-linejoin="round"/>
      <path d="M25 14 Q15 12 14 20 Q15 28 25 26"
            fill="none" stroke="#f2eee7" stroke-width="2.4" stroke-linecap="round"/>
    </svg>

    <!-- sign-in (arrow icon only, no text) -->
    <div class="signin" role="button" aria-label="Sign in">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M13 6l6 6-6 6"/>
      </svg>
    </div>
  </div>
</body>
</html>
